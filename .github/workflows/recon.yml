name: Daily Recon 5 Targets
on:
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch:
jobs:
  recon:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install Tools
        run: |
          go install -v github.com/projectdiscovery/subfinder/v2/cmd/subfinder@latest
          go install -v github.com/projectdiscovery/httpx/cmd/httpx@latest
          go install -v github.com/projectdiscovery/nuclei/v3/cmd/nuclei@latest
          go install -v github.com/projectdiscovery/dnsx/cmd/dnsx@latest
          go install -v github.com/PentestPad/subzy@latest
          echo "$HOME/go/bin" >> $GITHUB_PATH
          nuclei -update-templates -silent
      - name: Recon All Targets
        run: |
          mkdir -p results
          for d in $(cat targets.txt); do
            echo "=== Recon $d ==="
            subfinder -d $d -all -silent -o results/$d-subs.txt || true
            sort -u results/$d-subs.txt -o results/$d-subs.txt
            httpx -l results/$d-subs.txt -silent -o results/$d-live.txt -status-code -title || true
            subzy run --targets results/$d-subs.txt --hide_fails --vuln --output results/$d-takeover-subzy.txt || true
            nuclei -l results/$d-live.txt -t ~/nuclei-templates/http/takeovers/ -o results/$d-takeover-nuclei.txt -silent || true
            dnsx -l results/$d-subs.txt -silent -cname -resp-only | grep -i "cloudsmith\|bitly\|framer\|s3\|azure\|github.io\|heroku\|shopify" | tee results/$d-cname.txt || true
            cat results/$d-takeover-subzy.txt results/$d-takeover-nuclei.txt results/$d-cname.txt > results/$d-takeover.txt 2>/dev/null || true
            cat results/$d-takeover.txt
          done
      - name: Build Dashboard
        run: |
          echo "<html><head><title>recon.aptumi.com</title><meta name=viewport content='width=device-width'><style>body{font-family:monospace;background:#0a0a0a;color:#0f0;padding:15px;position:relative;min-height:100vh} body::before{content:'';position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:70vw;height:70vh;background:url('logo.png') no-repeat center;background-size:contain;opacity:0.07;z-index:-1} .header{display:flex;align-items:center;gap:15px;border-bottom:2px solid #0f0;padding-bottom:12px;margin-bottom:20px;background:rgba(0,20,0,0.9)} .header img{width:65px;height:65px;filter:drop-shadow(0 0 12px #0f0)} .card{border:1px solid #0f0;padding:12px;margin:12px 0;word-break:break-all;background:rgba(0,15,0,0.88);backdrop-filter:blur(3px)} .danger{color:#fff;background:#a00;padding:10px;border:2px solid red;font-weight:bold;box-shadow:0 0 15px red} a{color:#0ff}</style></head><body><div class=header><img src='logo.png'><div><h1 style=margin:0;letter-spacing:2px>recon.aptumi.com</h1><small>APTUMI TAKEOVER HUNTER - Last: $(date -u) - Next: 02:00 WIB auto</small></div></div>" > index.html
          for f in results/*-live.txt; do
            dom=$(echo $f | sed 's|results/||' | sed 's|-live.txt||')
            live=$(wc -l < $f 2>/dev/null || echo 0)
            subs=$(wc -l < results/$dom-subs.txt 2>/dev/null || echo 0)
            tk=$(cat results/$dom-takeover.txt 2>/dev/null)
            if [ -s results/$dom-takeover.txt ]; then
              echo "<div class=card><h2>🔥 $dom - $live live / $subs subs</h2><div class=danger><h3>⚠️ POTENTIAL TAKEOVER FOUND!</h3><pre>$tk</pre></div><a href=results/$dom-takeover.txt>📄 detail</a> | <a href=results/$dom-live.txt>🌐 live</a> | <a href=results/$dom-subs.txt>📋 all subs</a></div>" >> index.html
            else
              echo "<div class=card><h2>$dom - $live live / $subs subs</h2><p>✅ Aman - tidak ada takeover</p><a href=results/$dom-live.txt>live</a> | <a href=results/$dom-subs.txt>subs</a></div>" >> index.html
            fi
          done
          echo "</body></html>" >> index.html
      - name: Push
        run: |
          git config user.name "recon-bot"
          git config user.email "bot@aptumi.com"
          git add results/ index.html || true
          git add logo.png 2>/dev/null || true
          git commit -m "update takeover with logo $(date -u)" || true
          git push
